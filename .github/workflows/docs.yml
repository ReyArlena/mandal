# Builds the VitePress site under docs/ and publishes it to GitHub Pages on
# every push to main that touches the docs. Pages must be set to deploy from
# "GitHub Actions" in the repository settings; only the built site is
# published, never the repository itself.

name: Docs

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "scripts/cli-reference.sh"
      - "server/lib/commands/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Command table matches the CLI
        run: bash scripts/cli-reference.sh --check

      - name: Build
        run: bun run docs:build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
