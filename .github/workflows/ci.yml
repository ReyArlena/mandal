# Checks on every push to main and every pull request: the panel's tests
# and code style, the CLI's tests and shellcheck, that the CLI archive
# the panel ships hashes the same as the CLI hashes itself, and that the
# docs build with a command table matching the CLI.

name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  panel:
    name: Panel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, intl, sqlite3, pdo_sqlite, curl, zip, gd, bcmath
          coverage: none

      - uses: oven-sh/setup-bun@v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install front-end dependencies and build assets
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style
        run: vendor/bin/pint --test

      - name: Tests
        run: php artisan test --exclude-testsuite=Browser

      - name: CLI archive hash matches the CLI build hash
        run: |
          panel="$(php artisan tinker --execute 'echo app(App\Mandal\CliArchive::class)->hash();')"
          cli="$(MANDAL_ROOT=server bash -c 'source "$MANDAL_ROOT/lib/core.sh"; mandal_build_hash')"
          echo "panel=$panel cli=$cli"
          [ "$panel" = "$cli" ]

  cli:
    name: Server CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck
        run: shellcheck -x server/bin/mandal server/lib/*.sh server/lib/commands/*.sh server/lib/roles/*/*.sh server/setup.sh server/install.sh server/tests/run.sh

      - name: Tests
        run: bash server/tests/run.sh

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Command table matches the CLI
        run: bash scripts/cli-reference.sh --check

      - name: Build
        run: bun run docs:build
